<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hesabım – Habbo Arşiv</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--surface:#0e1527;--surface2:#141d36;--line:#1f2a4a;--line2:#2c3c6b;--ink:#f1f5ff;--mute:#93a3cc}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 15px/1.55 Manrope,system-ui,sans-serif}
a{color:inherit}
</style>
<link rel="stylesheet" href="tema-sayfa.css">
<link rel="stylesheet" href="site.css">
</head>
<body data-sec="A">
<main class="hm" id="hm"></main>
<script src="hesap.js"></script>
<script src="site.js"></script>
<script>
(function () {
  const S = SITE, h = HESAP.oku(), kok = document.getElementById("hm"), el = S.el;
  const giris = (d) => { const b = el("div", "hm-in"); b.style.setProperty("--d", d || "0s"); return b; };

  // Motto: ismin altında, yerinde düzenlenir. Sütun yoksa ya da okunamazsa blok kendini gizler.
  const mottoKur = (kisi) => {
    const MAX = 38;   // Habbo'daki sınırla aynı
    const kap = el("div", "hm-motto yukleniyor");
    let mevcut = "";

    const goster = (parla) => {
      kap.className = "hm-motto"; kap.textContent = "";
      const b = el("button", "hm-m-btn" + (mevcut ? "" : " bos") + (parla ? " parla" : ""));
      b.type = "button"; b.setAttribute("aria-label", mevcut ? "Mottoyu düzenle" : "Motto ekle");
      const t = el("span", "hm-m-tx"); t.textContent = mevcut || "Motto ekle";
      b.appendChild(t); b.insertAdjacentHTML("beforeend", S.svg("pen"));
      b.onclick = duzenle; kap.appendChild(b);
    };

    const duzenle = () => {
      kap.className = "hm-motto duzenle"; kap.textContent = "";
      const f = el("form", "hm-m-form"); f.autocomplete = "off";
      const kutu = el("div", "hm-m-kutu");
      const inp = el("input", "hm-m-in"); inp.type = "text"; inp.maxLength = MAX; inp.value = mevcut;
      inp.placeholder = "Kendini tek cümleyle anlat"; inp.setAttribute("aria-label", "Motto"); inp.spellcheck = false;
      const say = el("span", "hm-m-say"); kutu.appendChild(inp); kutu.appendChild(say);
      const kay = el("button", "hm-m-kay", "Kaydet"); kay.type = "submit";
      const ip = el("button", "hm-m-ip", "Vazgeç"); ip.type = "button";
      const satir = el("div", "hm-m-satir"); satir.appendChild(kutu); satir.appendChild(kay); satir.appendChild(ip);
      const ms = el("div", "hm-m-msg"); ms.setAttribute("role", "status"); ms.setAttribute("aria-live", "polite");
      f.appendChild(satir); f.appendChild(ms); kap.appendChild(f);

      const guncelle = () => { say.textContent = inp.value.length + "/" + MAX; say.classList.toggle("dolu", inp.value.length >= MAX - 4); };
      inp.addEventListener("input", guncelle); guncelle();
      inp.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); goster(); } });
      ip.onclick = () => goster();
      f.onsubmit = async e => {
        e.preventDefault();
        const yeni = inp.value.replace(/\s+/g, " ").trim().slice(0, MAX);
        if (yeni === mevcut) return goster();
        kay.disabled = ip.disabled = inp.disabled = true; ms.textContent = ""; ms.className = "hm-m-msg";
        let ok = false;
        try {
          const r = await HESAP.rest("profiller?id=eq." + encodeURIComponent(kisi.id), {
            method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify({ motto: yeni || null })
          });
          ok = r.ok && Array.isArray(r.v) && r.v.length === 1;
        } catch { /* ağ hatası */ }
        if (ok) { mevcut = yeni; goster(true); return; }
        kay.disabled = ip.disabled = inp.disabled = false; inp.focus();
        ms.textContent = "Kaydedilemedi. Bağlantını kontrol edip tekrar dene."; ms.className = "hm-m-msg h";
      };
      inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    };

    HESAP.rest("profiller?select=motto&id=eq." + encodeURIComponent(kisi.id)).then(({ ok, v }) => {
      if (!ok || !Array.isArray(v)) return kap.remove();
      mevcut = (v[0] && v[0].motto) || ""; goster();
    }).catch(() => kap.remove());
    return kap;
  };

  if (!h) {   // oturum yoksa: giriş penceresini açan sade bir karşılama
    document.title = "Hesap Merkezi – Habbo Arşiv";
    kok.innerHTML = '<div class="hm-misafir hm-in"><svg class="logo" viewBox="0 0 32 32"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs><path d="M16 2 30 10v12L16 30 2 22V10z" fill="url(#mg)"/><path d="M16 2v14m0 0 14-6M16 16 2 10m14 6v14" stroke="rgba(255,255,255,.5)" stroke-width="1.4" fill="none"/></svg>' +
      '<h1>Hesap Merkezi</h1><p>Hesabına erişmek için giriş yap ya da Habbo hesabınla kayıt ol.</p>' +
      '<div class="gm-satir"><button class="gm-btn" data-giris="giris" type="button">Giriş yap</button><button class="gm-btn ik" data-giris="kayit" type="button">Kayıt ol</button></div></div>';
    return;
  }

  const r = S.rolOf(h), R = S.ROL[r], alan = HESAP.OTELLER[h.otel] || "";
  // karşılama ve profil alanı
  const hero = el("section", "hm-hero hm-in");
  const av = el("div", "hm-avatar"); av.appendChild(el("span", "hm-floor"));
  const im = document.createElement("img"); im.alt = ""; im.src = "https://www.habbo" + (alan || ".com") + "/habbo-imaging/avatarimage?user=" + encodeURIComponent(h.ad) + "&direction=2&head_direction=3&gesture=sml&size=l";
  im.onerror = () => { av.classList.add("yok"); im.replaceWith(el("span", "", S.svg("user"))); };
  av.appendChild(im);
  const tx = el("div", "hm-text");
  tx.appendChild(el("p", "hm-hos", "Tekrar hoş geldin,"));
  const ad = el("h1", "hm-ad"); ad.textContent = h.ad; tx.appendChild(ad);
  tx.appendChild(mottoKur(h));
  tx.appendChild(el("div", "hm-rozetler", S.rozet(r) + S.otelEt(h.otel) + '<span class="hm-aktif"><i></i>Aktif oturum</span>'));
  // hesap bilgileri (profil alanının sağında)
  const panel = el("div", "hm-panel");
  const sat = (ic, et, de, al) => panel.appendChild(el("div", "hm-sat", '<span class="hm-s-ic">' + S.svg(ic) + '</span><div><div class="hm-s-et">' + et + '</div><div class="hm-s-de">' + de + '</div>' + (al ? '<div class="hm-s-al">' + al + '</div>' : "") + '</div>'));
  sat("user", "Kullanıcı adı", "", S.svg("verify") + "Habbo hesabı, mottonla doğrulandı");
  panel.querySelector(".hm-s-de").textContent = h.ad;
  sat("build", "Otel", S.otelEt(h.otel), "habbo" + alan);
  sat("shield", "Yetki", S.rozet(r), R.acik);
  hero.appendChild(av); hero.appendChild(tx); hero.appendChild(panel); kok.appendChild(hero);
  document.title = h.ad + " – Habbo Arşiv";

  // hızlı erişim: sadece yetkisi olanlara
  if (r === "yazar" || r === "yonetici") {
    const hz = giris(".14s"); hz.className += " hm-hizli"; hz.appendChild(el("h2", "hm-baslik", "Hızlı erişim"));
    const k = el("a", "hm-kart", '<span class="hm-ikon">' + S.svg("paper") + '</span><div class="hm-k-tx"><h3>Haber Paneli</h3><p>Haber yaz, taslaklarını düzenle ve yayınla.</p></div><span class="hm-git">Panele git ' + S.svg("arrow") + '</span>');
    k.href = "/haber-yaz"; hz.appendChild(k); kok.appendChild(hz);
  }

  // çıkış: ikincil işlem
  const c = giris(".28s"); c.className += " hm-cikis";
  const b = el("button", "hm-cik", S.svg("out") + "Çıkış yap"); b.type = "button"; b.onclick = S.cikis; c.appendChild(b); kok.appendChild(c);
})();
</script>
</body>
</html>
