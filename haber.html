<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<style>
:root{--bg:#f4f6f9;--surface:#fff;--line:#e2e6ed;--ink:#161a22;--mute:#667085;--acc:#2858d8;--accS:#e9effd;--hot:#e5484d}

<style>
/* ---- yorumlar ---- */
.yrm{padding:22px 26px 12px}

.yrm-isk>div{flex:1}.yrm-isk .b{height:14px;width:34%;margin:4px 0 10px}.yrm-isk .c{height:12px;width:78%}

  .yrm{padding:18px 16px 8px}.yf{gap:10px}.yf>.av{width:38px;height:38px}.yo{gap:11px}
}

/* ---- yanıtlar, emoji, GIF ---- */
.yf-sag{position:relative}
.yf-alt{flex-wrap:wrap}
.ybtn{all:unset;box-sizing:border-box;cursor:pointer;min-width:38px;height:36px;padding:0 10px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:10px;background:var(--glass);color:var(--mute);font:800 .78rem Manrope,sans-serif;transition:border-color .15s,color .15s}
.ybtn:hover,.ybtn:focus-visible{border-color:var(--c1);color:var(--ink)}
.ybtn:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.yrm .btn.ik{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.yp{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:6px;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 18px 40px -14px rgba(0,0,0,.8)}
.yp[hidden]{display:none!important}
.yp-emoji{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:2px;max-height:220px;overflow-y:auto}
.yp-emoji button{all:unset;box-sizing:border-box;cursor:pointer;height:36px;display:grid;place-items:center;border-radius:8px;font-size:1.3rem}
.yp-emoji button:hover,.yp-emoji button:focus-visible{background:color-mix(in srgb,var(--c1) 16%,transparent)}
.yp-gif input{width:100%;margin-bottom:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font:inherit}
.yp-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;max-height:260px;overflow-y:auto;color:var(--mute);font-size:.88rem}
.yp-izgara button{all:unset;box-sizing:border-box;cursor:pointer;border-radius:8px;overflow:hidden;background:var(--surface2);aspect-ratio:4/3}
.yp-izgara button:hover,.yp-izgara button:focus-visible{outline:2px solid var(--c1)}
.yp-izgara img{display:block;width:100%;height:100%;object-fit:cover}
.yp-kay{display:block;margin-top:8px;color:var(--mute);font-size:.72rem;text-align:right}
.yf-gif{position:relative;display:inline-block;margin-top:8px}
.yf-gif img{display:block;max-height:160px;max-width:100%;border-radius:10px}
.yf-gk{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:6px;right:6px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:rgba(6,10,24,.75);color:#fff;font-size:.8rem}
.yo-gif{display:block;max-width:min(100%,280px);max-height:220px;margin-top:8px;border-radius:12px}
.yo .yan{margin-left:4px;padding:2px 6px;border:0;border-radius:8px;background:none;color:var(--mute);font:700 .8rem Manrope,sans-serif;cursor:pointer;transition:color .15s}
.yo .yan:hover,.yo .yan:focus-visible{color:var(--c1)}
.yo-yk{margin-top:10px}
.yo-yk:empty{display:none}
.yf.yanit>.av{width:38px;height:38px}
.yf.yanit .yf-sag textarea{min-height:68px}
.yy{margin:0 0 6px 58px;padding-left:14px;border-left:2px solid color-mix(in srgb,var(--c1) 30%,var(--line))}
.yy .yo{padding:12px 10px;margin:0 -10px}
.yy .yo.alt .yo-av .av{width:36px;height:36px}
.yt+.yt{border-top:1px solid var(--line)}
.yt .yo:first-child{border-top-color:transparent}
@media (max-width:560px){.yy{margin-left:18px;padding-left:10px}}
/* yorum içindeki GIF'ler: eski ".yo img" (40x40 avatar) kuralını ezer */
.yo .yo-gif{display:block;width:auto;height:auto;max-width:min(100%,280px);max-height:220px;object-fit:contain;image-rendering:auto;background:none;border-radius:12px;margin-top:8px;flex:none}
.yo .yf-gif img{display:block;width:auto;height:auto;max-width:100%;max-height:160px;object-fit:contain;image-rendering:auto;background:none;border-radius:10px;margin:0}
.yo .yp-izgara img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto;background:none;border-radius:0;margin:0}
.yy-d{all:unset;box-sizing:border-box;cursor:pointer;margin:6px 0 10px;padding:4px 2px;color:var(--c1);font:800 .84rem Manrope,sans-serif}
.yy-d:hover,.yy-d:focus-visible{text-decoration:underline}
.yy-d:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
</style>

<body data-sec="H" data-nav="H">
<main>
<a class="geri" href="haberler">← Tüm haberler</a>
<article id="haber"><div class="govde">Yükleniyor...</div></article>
<section class="yrm" id="yrm" hidden><h2 id="yb">Yorumlar</h2><div id="yform"></div><div id="yliste"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="hesap.js"></script>
<script src="site.js"></script>
<script>
const CLOUD = "md4etvsz";
const $ = id => document.getElementById(id);
const kutu = $("haber");
function hata(t) { kutu.innerHTML = ""; const d = document.createElement("div"); d.className = "govde"; d.textContent = t; kutu.append(d); }

DOMPurify.addHook("afterSanitizeAttributes", n => {
  if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer nofollow"); }
  if (n.tagName === "IMG") {
    if (!(n.getAttribute("src") || "").startsWith("https://res.cloudinary.com/" + CLOUD + "/")) n.remove();
    else n.setAttribute("loading", "lazy");
  }
});


/* ---------- yardımcılar ---------- */
const S = SITE, el = S.el;
const habboUrl = (otel, ad, ek) => "https://www.habbo" + (HESAP.OTELLER[otel] || ".com") + "/habbo-imaging/avatarimage?user=" + encodeURIComponent(ad) + "&" + ek;
function zaman(t) {
  const d = new Date(t); if (isNaN(d)) return "";
  const s = Math.max(0, Math.round((Date.now() - d) / 1000));
  if (s < 60) return "az önce";
  if (s < 3600) return Math.floor(s / 60) + " dk önce";
  if (s < 86400) return Math.floor(s / 3600) + " saat önce";
  if (s < 7 * 86400) return Math.floor(s / 86400) + " gün önce";
  const ayni = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString("tr-TR", ayni ? { day: "numeric", month: "long" } : { day: "numeric", month: "long", year: "numeric" });
}
const tamZaman = t => new Date(t).toLocaleString("tr-TR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
// Sütun izinleri farklıysa sırayla daha sade sorguyu dener (sayfa bozulmasın diye)
async function ilkDeneme(secenekler, yol) {
  let r = null;
  for (const s of secenekler) { r = await HESAP.rest(yol(s)); if (r.ok) return r; }
  return r;
}

/* ---------- yorumlar ---------- */
const YMAX = 300;
const YANIT_ILK = 3;                    // her yorumun altında ilk görünen yanıt sayısı                       // yorum karakter sınırı
const GIPHY_KEY = "XQ3AWYjiTAyzZUZ4XzHZFHZWbfSGAdWU";                   // Giphy API anahtarını buraya yaz. Boşsa GIF düğmesi görünmez.
const GIF_URL = /^https:\/\/media\d*\.giphy\.com\//;
// Yeni sütunlar (ust_id, gif) henüz eklenmediyse eski sorguya düşer, sayfa bozulmaz
const YSEC = [
  "id,metin,olusturma,yazar_id,ust_id,gif,profiller(habbo_ad,otel,rol)",
  "id,metin,olusturma,yazar_id,profiller(habbo_ad,otel,rol)",
  "id,metin,olusturma,yazar_id,profiller(habbo_ad,otel)"
];
const EMOJILER = "😀 😃 😄 😁 😆 😅 😂 🤣 🙂 😉 😊 😇 🥰 😍 🤩 😘 😋 😜 🤪 😎 🤓 🥳 😏 😒 😔 😢 😭 😤 😡 🤯 😱 😴 🤔 🤗 🙄 😬 🥺 😳 🫡 🫶 🤝 👍 👎 👏 🙌 🙏 💪 👀 🔥 ✨ ⭐ 💯 ❤️ 🧡 💛 💚 💙 💜 🖤 💔 🎉 🎁 🏆 🎮 👑 🍀 🌈 ☀️ 🌙 ⚡ 💎 🚀 🐱 🐶 🐸 🐧 🦄 😈 💀 👻 🤡 🤖".split(" ");

// Açık emoji / GIF kutuları dışarı tıklayınca kapansın
document.addEventListener("click", e => {
  document.querySelectorAll(".yp").forEach(p => { if (!p.hidden && !p.contains(e.target) && !e.target.closest(".ybtn")) p.hidden = true; });
});

/* Yorum yazma kutusu: ana yorum ve yanıt için aynı kutu kullanılır.
   ust: yanıtlanan ana yorumun id'si (ana yorumda null). yeni(id): gönderilince çağrılır. */
function yorumKutusu(n, h, o) {
  const kap = el("div", "yf" + (o.ust ? " yanit" : ""));
  const sag = el("div", "yf-sag");
  const ta = el("textarea"); ta.maxLength = YMAX; ta.rows = 2; ta.value = o.baslangic || "";
  ta.placeholder = o.ust ? "Yanıtını yaz..." : "Düşüncelerini yorumlarda belirt!";
  let gif = null;
  const onizle = el("div", "yf-gif"); onizle.hidden = true;
  const alt = el("div", "yf-alt"), say = el("span", "yf-say");
  const bilgi = el("div", "ym"); bilgi.setAttribute("role", "status"); bilgi.setAttribute("aria-live", "polite");
  const gonder = el("button", "btn", "Gönder"); gonder.type = "button"; gonder.disabled = true;

  const guncelle = () => {
    ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 320) + "px";
    say.textContent = ta.value.length + "/" + YMAX;
    gonder.disabled = !ta.value.trim() && !gif;
  };
  ta.addEventListener("input", guncelle);
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !gonder.disabled) gonder.click(); });

  // ---- emoji ----
  const eb = el("button", "ybtn", "😊"); eb.type = "button"; eb.title = "Emoji ekle"; eb.setAttribute("aria-label", "Emoji ekle");
  const ep = el("div", "yp yp-emoji"); ep.hidden = true;
  EMOJILER.forEach(x => {
    const b = el("button", "", x); b.type = "button";
    b.onclick = () => {
      const i = ta.selectionStart == null ? ta.value.length : ta.selectionStart, j = ta.selectionEnd == null ? i : ta.selectionEnd;
      if (ta.value.length - (j - i) + x.length > YMAX) return;
      ta.setRangeText(x, i, j, "end"); guncelle(); ta.focus();
    };
    ep.appendChild(b);
  });
  eb.onclick = () => { const ac = ep.hidden; document.querySelectorAll(".yp").forEach(p => p.hidden = true); ep.hidden = !ac; };

  alt.append(say, eb);
  const kutular = [ep];

  // ---- GIF (Giphy) ----
  if (GIPHY_KEY) {
    const gb = el("button", "ybtn gifb", "GIF"); gb.type = "button"; gb.title = "GIF ekle"; gb.setAttribute("aria-label", "GIF ekle");
    const gp = el("div", "yp yp-gif"); gp.hidden = true;
    const ara = el("input"); ara.type = "search"; ara.placeholder = "GIF ara..."; ara.autocomplete = "off"; ara.setAttribute("aria-label", "GIF ara");
    const izgara = el("div", "yp-izgara"), kaynak = el("small", "yp-kay", "Powered by GIPHY");
    gp.append(ara, izgara, kaynak);
    let gz = 0, sira = 0;
    async function gifAra(q) {
      const no = ++sira; izgara.textContent = "Yükleniyor...";
      const u = "https://api.giphy.com/v1/gifs/" + (q ? "search?q=" + encodeURIComponent(q) + "&" : "trending?") + "api_key=" + GIPHY_KEY + "&limit=24&rating=g&lang=tr";
      let v = null; try { v = await (await fetch(u)).json(); } catch { /* boş kalır */ }
      if (no !== sira) return; izgara.textContent = "";
      const l = ((v && v.data) || []).filter(x => x.images && x.images.fixed_height && GIF_URL.test(x.images.fixed_height.url));
      if (!l.length) { izgara.textContent = "Sonuç bulunamadı."; return; }
      l.forEach(x => {
        const b = el("button", "", ""); b.type = "button"; b.title = x.title || "GIF";
        const im = el("img"); im.loading = "lazy"; im.alt = x.title || "GIF"; im.src = (x.images.fixed_height_small || x.images.fixed_height).url;
        b.appendChild(im);
        b.onclick = () => { gif = x.images.fixed_height.url; gp.hidden = true; gifGoster(); guncelle(); };
        izgara.appendChild(b);
      });
    }
    ara.addEventListener("input", () => { clearTimeout(gz); gz = setTimeout(() => gifAra(ara.value.trim()), 350); });
    gb.onclick = () => { const ac = gp.hidden; document.querySelectorAll(".yp").forEach(p => p.hidden = true); gp.hidden = !ac; if (ac) { ara.focus(); if (!izgara.firstChild) gifAra(""); } };
    alt.appendChild(gb); kutular.push(gp);
  }
  function gifGoster() {
    onizle.textContent = ""; onizle.hidden = !gif; if (!gif) return;
    const im = el("img"); im.alt = "Seçilen GIF"; im.src = gif;
    const k = el("button", "yf-gk", "✕"); k.type = "button"; k.setAttribute("aria-label", "GIF'i kaldır");
    k.onclick = () => { gif = null; gifGoster(); guncelle(); };
    onizle.append(im, k);
  }

  if (o.iptal) { const ip = el("button", "btn ik", "Vazgeç"); ip.type = "button"; ip.onclick = o.iptal; alt.appendChild(ip); }
  alt.appendChild(gonder);

  gonder.onclick = async () => {
    const metin = ta.value.trim(); if (!metin && !gif) return;
    gonder.disabled = true;
    const govde = { haber_id: n.id, yazar_id: h.id, metin };
    if (o.ust) govde.ust_id = o.ust; if (gif) govde.gif = gif;
    const r = await HESAP.rest("yorumlar", { method: "POST", body: JSON.stringify(govde), headers: { Prefer: "return=representation" } });
    if (!r.ok) { gonder.disabled = false; bilgi.className = "ym h"; bilgi.textContent = (r.v && r.v.message) || "Yorum gönderilemedi. Tekrar dene."; return; }
    ta.value = ""; gif = null; gifGoster(); guncelle();
    bilgi.className = "ym ok"; bilgi.textContent = o.ust ? "Yanıtın yayınlandı." : "Yorumun yayınlandı.";
    o.yeni(r.v && r.v[0] ? r.v[0].id : null);
  };

  sag.append(ta, onizle, alt, ...kutular, bilgi);
  kap.append(S.avatar(h, "m", true, o.ust ? "kucuk" : "orta"), sag);
  guncelle();
  return kap;
}

// c: yorum, ctx: { n, ust (yanıtın bağlanacağı ana yorum id'si), alt (yanıt mı) }
function yorumKarti(c, h, vurgu, yenile, ctx) {
  const p = c.profiller || {}, ben = !!h && h.id === c.yazar_id;
  const kisi = { id: c.yazar_id, ad: p.habbo_ad || "" }, acilir = !!kisi.ad && !!kisi.id, href = "profil?id=" + encodeURIComponent(kisi.id);
  const d = el("div", "yo" + (ben ? " ben" : "") + (vurgu ? " yeni" : "") + (ctx.alt ? " alt" : ""));
  let av;
  if (acilir) {
    av = el("a", "yo-av"); av.href = href; av.setAttribute("aria-label", kisi.ad + " profilini aç");
    av.appendChild(S.avatar({ ad: kisi.ad, otel: p.otel }, "m", true, ""));
  } else { av = el("span", "yo-av"); av.appendChild(el("span", "av yok", S.svg("user"))); }

  const k = el("div", "yo-k"), bas = el("div", "yo-bas");
  let ad;
  if (acilir) { ad = el("a", "yo-ad"); ad.href = href; } else ad = el("b", "yo-ad");
  ad.textContent = kisi.ad || "Silinmiş kullanıcı"; bas.appendChild(ad);
  bas.insertAdjacentHTML("beforeend", S.rozet(S.rolOf(p)));   // üye, yazar, moderatör, yönetici: herkesin etiketi görünür
  if (p.otel) bas.insertAdjacentHTML("beforeend", S.otelEt(p.otel));
  if (ben) bas.appendChild(el("span", "yo-ben", "Sen"));
  const tm = el("time"); tm.dateTime = c.olusturma; tm.title = tamZaman(c.olusturma); tm.textContent = zaman(c.olusturma); bas.appendChild(tm);

  const rol = h ? S.rolOf(h) : "";   // yorumu yazan, moderatör ve yönetici silebilir
  if (h && (ben || rol === "yonetici" || rol === "moderator")) {
    const s = el("button", "sil", "Sil"); s.type = "button"; let zm;
    s.onclick = async () => {   // iki adım: önce "Emin misin?", sonra siler
      if (!s.classList.contains("sor")) {
        s.classList.add("sor"); s.textContent = ctx.alt ? "Emin misin?" : "Yanıtlarla birlikte sil?";
        zm = setTimeout(() => { s.classList.remove("sor"); s.textContent = "Sil"; }, 3000); return;
      }
      clearTimeout(zm); s.disabled = true;
      const x = await HESAP.rest("yorumlar?id=eq." + c.id, { method: "DELETE" });
      if (x.ok) yenile(null); else { s.disabled = false; s.classList.remove("sor"); s.textContent = "Sil"; }
    };
    bas.appendChild(s);
  }
  k.appendChild(bas);
  if (c.metin) { const t = el("p", "yo-metin"); t.textContent = c.metin; k.appendChild(t); }
  if (c.gif && GIF_URL.test(c.gif)) { const g = el("img", "yo-gif"); g.loading = "lazy"; g.alt = "GIF"; g.src = c.gif; k.appendChild(g); }

  // Yanıtla: yanıt kutusu yorumun altında açılır. Yanıta yanıt, aynı ana yorumun altına bağlanır
  if (h && ctx.n.durum === "yayinda") {
    const slot = el("div", "yo-yk"), yb = el("button", "yan", "Yanıtla"); yb.type = "button";
    yb.onclick = () => {
      if (slot.firstChild) { slot.textContent = ""; return; }
      const kutu = yorumKutusu(ctx.n, h, { ust: ctx.ust, baslangic: ctx.alt && kisi.ad ? "@" + kisi.ad + " " : "", yeni: id => yenile(id), iptal: () => { slot.textContent = ""; } });
      slot.appendChild(kutu); const ta = kutu.querySelector("textarea"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    };
    bas.appendChild(yb); k.appendChild(slot);
  }
  d.append(av, k); return d;
}

async function yorumlariKur(n) {
  $("yrm").hidden = false;
  const h = HESAP.oku(), liste = $("yliste"), form = $("yform"), acik = new Set();   // yanıtları açılmış ana yorumlar
  const baslik = say => { const b = $("yb"); b.textContent = "Yorumlar"; if (say != null) b.appendChild(el("span", "yrm-say", String(say))); };
  baslik();
  liste.innerHTML = '<div class="yrm-isk"><i class="a"></i><div><i class="b"></i><i class="c"></i></div></div><div class="yrm-isk"><i class="a"></i><div><i class="b"></i><i class="c"></i></div></div>';

  async function yukle(vurguId) {
    const r = await ilkDeneme(YSEC, s => "yorumlar?haber_id=eq." + n.id + "&select=" + s + "&order=olusturma.desc&limit=200");
    liste.textContent = "";
    if (!r || !r.ok) { liste.appendChild(el("p", "yrm-bos", "Yorumlar yüklenemedi. Sayfayı yenileyip tekrar dene.")); return; }
    const hepsi = r.v; baslik(hepsi.length);
    if (!hepsi.length) { liste.appendChild(el("p", "yrm-bos", "Henüz yorum yok. İlk yorumu sen yaz.")); return; }
    const var_ = new Set(hepsi.map(c => c.id)), yanit = {}, ana = [];
    hepsi.forEach(c => { if (c.ust_id && var_.has(c.ust_id)) (yanit[c.ust_id] = yanit[c.ust_id] || []).push(c); else ana.push(c); });
    ana.forEach(c => {
      const dal = el("div", "yt");
      dal.appendChild(yorumKarti(c, h, c.id === vurguId, yukle, { n, ust: c.id, alt: false }));
      const ys = (yanit[c.id] || []).slice().reverse();   // yanıtlar eskiden yeniye
      if (ys.some(y => y.id === vurguId)) acik.add(c.id);   // yeni yazılan yanıt görünsün
      if (ys.length) {
        const kutu = el("div", "yy");
        const ciz = () => {
          kutu.textContent = "";
          (acik.has(c.id) ? ys : ys.slice(0, YANIT_ILK)).forEach(y => kutu.appendChild(yorumKarti(y, h, y.id === vurguId, yukle, { n, ust: c.id, alt: true })));
          if (ys.length > YANIT_ILK) {
            const d = el("button", "yy-d", acik.has(c.id) ? "Yanıtları gizle" : (ys.length - YANIT_ILK) + " yanıtı daha göster"); d.type = "button";
            d.onclick = () => { if (acik.has(c.id)) acik.delete(c.id); else acik.add(c.id); ciz(); };
            kutu.appendChild(d);
          }
        };
        ciz(); dal.appendChild(kutu);
      }
      liste.appendChild(dal);
    });
  }

  if (!h) {
    form.innerHTML = '<div class="yf-misafir"><div><b>Sohbete katıl</b><p>Yorum yazmak için Habbo Arşiv hesabınla giriş yap. Habbo şifren hiçbir zaman istenmez.</p></div>' +
      '<div class="yf-btn"><button class="btn" data-giris="giris" type="button">Giriş yap</button><button class="btn ik" data-giris="kayit" type="button">Kayıt ol</button></div></div>';
  } else if (n.durum !== "yayinda") form.textContent = "Taslağa yorum yazılamaz.";
  else form.appendChild(yorumKutusu(n, h, { ust: null, yeni: id => yukle(id) }));
  yukle(null);
}
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  if (!/^\d+$/.test(id || "")) return hata("Haber bulunamadı.");
  const r = await HESAP.rest("haberler?id=eq." + id + "&select=*,profiller(habbo_ad,otel)");
  if (!r.ok || !r.v[0]) return hata("Haber bulunamadı ya da yayından kaldırıldı.");
  const n = r.v[0], y = n.profiller || {};
  document.title = n.baslik + " – Habbo Arşiv";
  kutu.innerHTML = "";
  if (n.kapak && n.kapak.startsWith("https://res.cloudinary.com/" + CLOUD + "/")) {
    const k = document.createElement("img"); k.className = "kapak"; k.alt = ""; k.src = n.kapak.replace("/upload/", "/upload/w_1200/"); kutu.append(k);
  }
  const g = document.createElement("div"); g.className = "govde";
  const et = document.createElement("div"); et.className = "et";
  if (n.sicak) { const s = document.createElement("span"); s.className = "hot"; s.textContent = "HOT"; et.append(s); }
  for (const t of n.etiketler || []) { const s = document.createElement("span"); s.textContent = t; et.append(s); }
  if (et.children.length) g.append(et);
  const h1 = document.createElement("h1"); h1.textContent = n.baslik; g.append(h1);
  const m = document.createElement("div"); m.className = "meta";
  m.textContent = (y.habbo_ad ? y.habbo_ad + " tarafından yazıldı · " : "") +
    new Date(n.yayin_tarihi || n.olusturma).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" }) +
    (n.durum !== "yayinda" ? " · TASLAK (sadece sen görüyorsun)" : "");
  g.append(m);
  const wrap = document.createElement("div"); wrap.className = "ql-snow";
  const ic = document.createElement("div"); ic.className = "ql-editor"; ic.id = "icerik";
  ic.innerHTML = DOMPurify.sanitize(n.icerik || "");
  wrap.append(ic); g.append(wrap); kutu.append(g);

  const lb = document.createElement("div"); lb.id = "lb"; lb.hidden = true; lb.append(document.createElement("img")); document.body.append(lb);
  lb.onclick = () => lb.hidden = true;
  addEventListener("keydown", e => { if (e.key === "Escape") lb.hidden = true; });
  ic.addEventListener("click", e => { if (e.target.tagName === "IMG") { lb.firstChild.src = e.target.src; lb.hidden = false; } });
  yorumlariKur(n);
})().catch(() => hata("Haber yüklenemedi. Sayfayı yenile ya da biraz sonra tekrar dene."));
