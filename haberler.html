<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haberler – Habbo Arşiv</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--surface:#fff;--line:#e2e6ed;--ink:#161a22;--mute:#667085;--acc:#2858d8;--accS:#e9effd;--accT:#fff;--hot:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--surface:#171b24;--line:#2a3040;--ink:#eef1f6;--mute:#98a2b3;--acc:#6b93ff;--accS:#1d2a4d;--accT:#0b1020}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Manrope,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}
a{color:inherit;text-decoration:none}.geri{color:var(--acc);font-weight:600;font-size:.9rem}
h1{margin:10px 0 4px;font:800 2rem/1.1 Manrope,sans-serif;letter-spacing:-.03em}
.alt{color:var(--mute);margin:0 0 20px}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.kart{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.kart:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(16,24,40,.16)}
.kap{position:relative;aspect-ratio:16/9;background:var(--accS)}
.kap img{width:100%;height:100%;object-fit:cover;display:block}
.hot{position:absolute;top:10px;right:10px;background:var(--hot);color:#fff;font:800 .7rem Manrope,sans-serif;padding:3px 9px;border-radius:99px}
.ic{padding:14px 16px 16px}
.et{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.et span{font:700 .68rem Manrope,sans-serif;padding:2px 9px;border-radius:99px;background:var(--accS);color:var(--acc);text-transform:uppercase}
.kart h2{margin:0 0 6px;font:800 1.1rem/1.3 Manrope,sans-serif}
.kart p{margin:0 0 10px;color:var(--mute);font-size:.9rem}
.kart small{color:var(--mute)}
</style>
</head>
<body>
<main>
<a class="geri" href="/">← Habbo Arşiv'e dön</a>
<h1>Haberler</h1>
<p class="alt">Habbo Arşiv'den güncel haberler ve rehberler.</p>
<div class="izgara" id="liste"><p>Yükleniyor...</p></div>
</main>
<script src="hesap.js"></script>
<script>
(async () => {
  const kutu = document.getElementById("liste");
  const r = await HESAP.rest("haberler?select=id,baslik,ozet,kapak,etiketler,sicak,yayin_tarihi,profiller(habbo_ad,otel)&durum=eq.yayinda&order=yayin_tarihi.desc&limit=60");
  kutu.textContent = "";
  if (!r.ok) { kutu.textContent = "Haberler yüklenemedi."; return; }
  if (!r.v.length) { kutu.textContent = "Henüz haber yok."; return; }
  for (const n of r.v) {
    const a = document.createElement("a"); a.className = "kart"; a.href = "haber?id=" + n.id;
    const kap = document.createElement("div"); kap.className = "kap";
    if (n.kapak && n.kapak.startsWith("https://res.cloudinary.com/")) {
      const im = document.createElement("img"); im.loading = "lazy"; im.alt = "";
      im.src = n.kapak.replace("/upload/", "/upload/w_560/"); kap.append(im);
    }
    if (n.sicak) { const h = document.createElement("span"); h.className = "hot"; h.textContent = "HOT"; kap.append(h); }
    const ic = document.createElement("div"); ic.className = "ic";
    if ((n.etiketler || []).length) {
      const et = document.createElement("div"); et.className = "et";
      for (const t of n.etiketler) { const s = document.createElement("span"); s.textContent = t; et.append(s); }
      ic.append(et);
    }
    const b = document.createElement("h2"); b.textContent = n.baslik;
    const p = document.createElement("p"); p.textContent = n.ozet || "";
    const k = document.createElement("small"), y = n.profiller || {};
    k.textContent = (y.habbo_ad ? y.habbo_ad + " (" + (HESAP.OTELLER[y.otel] || "") + ") · " : "") +
      new Date(n.yayin_tarihi).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
    ic.append(b); if (n.ozet) ic.append(p); ic.append(k);
    a.append(kap, ic); kutu.append(a);
  }
})().catch(() => { document.getElementById("liste").textContent = "Haberler yüklenemedi. Sayfayı yenile ya da biraz sonra tekrar dene."; });
</script>
</body>
</html>
